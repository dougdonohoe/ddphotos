server {
    listen 80;
    root /usr/share/nginx/html;

    error_page 404 /404.html;

    # Everything revalidates on every request by default: HTML, JSON and covers can change
    # in-place. HTML matters most. A browser left to guess would keep an old page for days
    # after a deploy, and that page's scripts are deleted by the deploy, so it never hydrates.
    # A location with its own add_header drops this one, which is how the two below override it.
    add_header Cache-Control "no-cache";

    # SvelteKit content-hashes everything under /_app/immutable/, so those are immutable.
    # WebP photos and MP4 videos keep their names when photogen regenerates them, but the
    # site requests them with a ?v= version from index.json that changes when it does, so
    # they are immutable too. nginx serves byte ranges for static files by default, which
    # video seeking depends on, so no extra directive is needed for that. ^~ keeps the regex
    # locations below from claiming /_app.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(webp|mp4)$ {
        add_header Cache-Control "max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Remove trailing slash (301), except root.
    # Use $http_host (not $host) so the port is preserved in the Location header.
    location ~ ^(.+)/$ {
        return 301 $scheme://$http_host$1;
    }

    # Photo permalink: /albums/slug/N -> serve /albums/slug.html
    location ~ ^/albums/([^/]+)/\d+$ {
        try_files /albums/$1.html =404;
    }

    # Root: serve index.html directly (try_files $uri for / sees a directory and falls through)
    location = / {
        try_files /index.html =404;
    }

    # Serve exact file, or try .html extension; fall back to 404
    location / {
        try_files $uri $uri.html @spa_fallback;
    }

    location @spa_fallback {
        return 404;
    }
}
