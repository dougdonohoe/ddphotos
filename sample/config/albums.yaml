settings:
  id: sample
  site_name: "DD Photos Sample Albums"
  site_url: https://ddphotos.donohoe.info
  site_description: "DD Photos - Your memories, your way. No subscriptions, no lock-in, deploys in minutes with Docker."
  copyright_owner: "Doug and Cindy Donohoe"
  copyright_year: 2001
  allow_crawling: true
  descriptions: descriptions.txt
  site_title_html: >-
    <a href="https://github.com/dougdonohoe/ddphotos" target="_blank" rel="noopener">DD Photos</a>
  site_subtitle_html: >-
    Self-host your memories. No subscriptions, no lock-in, yours forever.
  site_overview_html: >-
    These albums are an example of what you can publish using 
    <a href="https://github.com/dougdonohoe/ddphotos/blob/main/README.md" target="_blank" rel="noopener">DD Photos</a>, 
    a free and open-source self-hosted photo gallery.
    Browse the photos below, then <a href="https://github.com/dougdonohoe/ddphotos-app#installation">download</a> the 
    companion DD Photos app to publish your own albums.
  hero:
    image: theway/2024-The-Way-13.jpg
    base: sample
    crop: center

bases:
  sample: sample/source

albums:
  - slug: the-way
    name: The Way
