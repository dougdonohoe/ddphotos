name: DD Photos CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
  # Nightly, to catch drift rather than code changes. Everything this repo pins exactly
  # (web/.nvmrc, web/.npm-version, package-lock.json, the Go toolchain in go.mod) is
  # already covered by the push and pull_request runs. What a scheduled run adds is the
  # part that still floats underneath us: the ffmpeg `latest` release, the
  # debian:bookworm-slim and golang:1.25-bookworm base images, the ubuntu-latest runner
  # image, the actions at @v4/@v5, apt packages, and Playwright's browser downloads.
  # Those break on a calendar rather than on a commit, and without this the first person
  # to find out is whoever opens the next PR.
  #
  # 05:17 UTC. Plain UTC rather than a `timezone:` key: the exact local time does not
  # matter for a nightly job, and UTC has no DST discontinuity to reason about. Off the
  # hour because GitHub's scheduler is busiest at :00.
  #
  # Do not expect it at 05:17. Scheduled Actions are best-effort and the lag is measured
  # in hours: this slot was delivered 5h13m late on 2026-08-29, and an occurrence is
  # sometimes dropped outright, leaving no trace anywhere in the API. Two other
  # constraints: a scheduled run only ever uses the default branch (editing the cron on a
  # PR branch changes nothing until it merges), and GitHub disables the schedule on a
  # public repo after 60 days with no activity, warning by email first.
  schedule:
    - cron: '17 5 * * *'
  # So the nightly path can be exercised without waiting for the overnight slot.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # Basic tests, Apache and rsync
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        # Via bin/ci-apt-install.sh rather than a bare apt-get: GitHub's runner images pin
        # their mirror to azure.archive.ubuntu.com, which stalls this step periodically
        # (once for 66 minutes, until the job timeout killed it). The script bounds apt's
        # timeouts, retries, and falls back to archive.ubuntu.com. See its header.
        run: bash bin/ci-apt-install.sh libvips-dev libheif-plugin-libde265 pkg-config

      - name: Install ffmpeg
        # The same pinned static build the Docker image fetches on demand, rather than
        # `apt-get install ffmpeg`: the Debian package pulls ~200 packages and 448MB of
        # SDL2/X11 via ffplay, which is both slow and a large surface for a flaky apt
        # mirror to stall on. This is one checksum-verified GitHub download of two
        # executables. photogen finds them via DDPHOTOS_FFMPEG_DIR (pkg/photogen/video.go).
        #
        # Installed under RUNNER_TEMP so the binaries stay out of the checkout. Set here
        # rather than in a job-level `env:` block because the `runner` context is not
        # available there; GITHUB_ENV carries it to the later steps, and the local export
        # covers this step, which GITHUB_ENV does not.
        run: |
          export DDPHOTOS_FFMPEG_DIR="$RUNNER_TEMP/ffmpeg"
          echo "DDPHOTOS_FFMPEG_DIR=$DDPHOTOS_FFMPEG_DIR" >> "$GITHUB_ENV"
          bash docker/do-install-ffmpeg.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Pin npm
        run: npm install -g npm@$(cat web/.npm-version)

      - name: Install Go dependencies
        run: go mod download

      - name: Install npm dependencies
        run: cd web && npm ci

      # test-cover rather than test: setup-go installs a full Go distribution, so the
      # `covdata` tool is present and coverage works. `make test` drops -cover so it also
      # works with a toolchain fetched via GOTOOLCHAIN auto-download (see the Makefile).
      - name: Go build, test, vet
        run: make build test-cover vet

      - name: Web lint (prettier + eslint)
        run: make web-lint

      - name: Web unit tests (vitest)
        run: make web-unit-test

      - name: Install Playwright Chromium
        # Deliberately no `npx playwright install-deps chromium` here. That runs apt-get
        # under the hood and was the most frequent victim of the flaky Azure mirror (up to
        # 479s in a job with no apt step of its own). The ubuntu-latest image preinstalls
        # Chrome and Firefox, so Chromium's shared libraries are already present. If a
        # future runner image drops them, this fails loudly at browser launch, not subtly.
        # (docs/INSTALL.md still documents install-deps for minimal Linux installs.)
        run: make web-playwright-install

      - name: Photogen and build
        run: make sample-photogen sample-build

      - name: Run Apache routing tests
        run: make web-docker-build-apache sample-test-apache

      - name: Run Apache Playwright e2e tests (all password variants)
        run: bin/test-all.sh --mode apache --ci

      - name: Run rsync deploy test
        run: make sample-rsync-test

  # Split out nginx/s3 tests to run in parallel
  test-nginx-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        # Via bin/ci-apt-install.sh rather than a bare apt-get: GitHub's runner images pin
        # their mirror to azure.archive.ubuntu.com, which stalls this step periodically
        # (once for 66 minutes, until the job timeout killed it). The script bounds apt's
        # timeouts, retries, and falls back to archive.ubuntu.com. See its header.
        run: bash bin/ci-apt-install.sh libvips-dev libheif-plugin-libde265 pkg-config

      - name: Install ffmpeg
        # Static build rather than `apt-get install ffmpeg`; see the 'test' job above.
        run: |
          export DDPHOTOS_FFMPEG_DIR="$RUNNER_TEMP/ffmpeg"
          echo "DDPHOTOS_FFMPEG_DIR=$DDPHOTOS_FFMPEG_DIR" >> "$GITHUB_ENV"
          bash docker/do-install-ffmpeg.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Pin npm
        run: npm install -g npm@$(cat web/.npm-version)

      - name: Install Go dependencies
        run: go mod download

      - name: Install npm dependencies
        run: cd web && npm ci

      - name: Install Playwright Chromium
        # Deliberately no `npx playwright install-deps chromium`; see the 'test' job above.
        run: make web-playwright-install

      - name: Photogen and build
        run: make sample-photogen sample-build

      - name: Run nginx routing tests
        run: make web-docker-build-nginx sample-test-nginx

      - name: Run nginx Playwright e2e tests (all password variants)
        run: bin/test-all.sh --mode nginx --ci

      - name: Run nginx rsync deploy test
        run: make sample-rsync-test-nginx

      - name: Run S3 deploy test
        run: make sample-s3-test

  # Docker-mode tests of 'ddphotos' can run in parallel
  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Pin npm
        run: npm install -g npm@$(cat web/.npm-version)

      - name: Install npm dependencies
        run: cd web && npm ci

      - name: Install Playwright Chromium
        # Deliberately no `npx playwright install-deps chromium`; see the 'test' job above.
        run: make web-playwright-install

      - name: Run Docker workflow tests
        run: make docker-test

  # A red X on an overnight run that nobody is watching needs somewhere to land: GitHub only
  # emails the owner, and the run scrolls off the Actions tab. bin/ci-open-issue.sh files
  # it as an issue, or comments on the open one if the same failure is already tracked.
  #
  # Scheduled runs only. On a push or a PR the person who triggered it is already looking
  # at the result, and an issue would be noise.
  #
  # `issues: write` is all this needs, and the built-in GITHUB_TOKEN carries it -- no PAT,
  # no secret to rotate. The grant has to be explicit because this repo's default workflow
  # permission is read-only, and it is scoped to this job so the three test jobs above
  # keep the read-only token they run with today.
  report-nightly-failure:
    needs: [test, test-nginx-s3, test-docker]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/nightly-failure.md" <<EOF
          The nightly run of this workflow failed.

          | Job | Result |
          | --- | --- |
          | test | ${{ needs.test.result }} |
          | test-nginx-s3 | ${{ needs.test-nginx-s3.result }} |
          | test-docker | ${{ needs.test-docker.result }} |

          No commit landed to cause this, so the likely culprit is something outside the
          repo moving: the floating ffmpeg \`latest\` release, a base image
          (\`debian:bookworm-slim\`, \`golang:1.25-bookworm\`), the \`ubuntu-latest\`
          runner image, an apt mirror, or a Playwright browser download. A genuinely flaky
          test is the other possibility -- re-run the workflow to tell them apart.

          [Failing run]($RUN_URL)
          EOF
          bash bin/ci-open-issue.sh nightly-ci "Nightly CI is failing" "$RUNNER_TEMP/nightly-failure.md"
