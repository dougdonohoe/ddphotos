name: Version Drift

# Nightly check on the versions no dependency updater watches, plus the one vulnerability
# question an updater cannot answer. The `check` job covers the pinned Node and npm
# versions, the `go` job covers the Go toolchain directive and reachable vulnerabilities.
# Each opens its own issue, so the two do not mix.
#
# web/.nvmrc and web/.npm-version hold exact versions deliberately (see CLAUDE.md): a
# floating tag like `node:24` means the same commit builds a different image depending on
# the day, and an upstream regression then arrives with no commit to bisect. The cost of
# pinning exactly is losing the one thing a floating tag gave us for free -- finding out
# that a fix or a security release shipped.
#
# Dependabot cannot restore that. It has no .nvmrc ecosystem, and its docker ecosystem
# cannot see a version in docker/Dockerfile's `FROM node:${NODE_VERSION}-bookworm-slim`
# because there is no literal tag there to bump. Renovate could, via its `nvm` manager,
# at the price of another bot with write access; bin/check-versions.sh is the same signal
# in one script that also spells out what to edit.
#
# The Go side is different, and worth being precise about rather than assuming the argument
# above carries over. Dependabot's gomod ecosystem works fine, and .github/dependabot.yml
# now uses it for module bumps, so this job deliberately does NOT report module drift: a PR
# with the edit made and CI run beats an issue saying a bump exists.
#
# What is left here is what no updater does. The `go` directive in go.mod is not a `require`
# line, so nothing bumps it, and every setup-go step reads it -- so a stale directive means
# CI tests on a Go outside its support window. And govulncheck walks the call graph, where
# Dependabot alerts only match manifest versions against GitHub's database; that is what
# keeps this quiet about the x/crypto/ssh advisories nothing here calls, and what caught
# GO-2026-6222 in x/image, which has a CVE but no GHSA and so no Dependabot alert.
#
# Note the "another bot with write access" argument above does not apply to Dependabot here:
# it already has write access and already opens PRs, since security updates are enabled. It
# was an argument against adding Renovate, a second bot, for the Node pins.
#
# Kept out of ci.yml on purpose: this reports on the outside world rather than testing the
# code, and it must not turn a PR red because Node shipped a patch release. That applies to
# govulncheck too, and is why it is not in the Go CI job: an advisory published overnight
# would fail an unrelated PR that changed nothing.
#
# Scheduled runs only ever use the default branch, and GitHub disables the schedule on a
# public repo after 60 days with no activity (warning by email first).
#
# Do not expect this to run at 05:37. Scheduled Actions are best-effort and the delivery
# lag is measured in hours, not minutes: on 2026-08-29 this workflow's slot arrived 1h34m
# late and ci.yml's arrived 5h13m late, and an occurrence is sometimes dropped outright
# with no trace anywhere in the API. That is fine for a nightly drift report, which only
# needs to run sometime. Do not reuse this pattern for anything time-sensitive, and when
# a slot appears to have been missed, wait several hours before concluding anything: a
# newly added or edited cron also takes 15-60 minutes just to register.

on:
  schedule:
    # 05:37 UTC, which is the small hours in both the US and Europe. Plain UTC rather than
    # a `timezone:` key: the exact local time does not matter for a drift report, and UTC
    # has no DST discontinuity to reason about. Off the hour because GitHub's scheduler is
    # busiest at :00.
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `issues: write` on the built-in GITHUB_TOKEN is all the issue needs: no PAT, no
    # secret to rotate. It has to be requested explicitly because this repo's default
    # workflow permission is read-only.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare pinned Node and npm versions against upstream
        id: check
        # Exit codes: 0 current, 1 behind, 2 the check itself could not run. Only 2 is a
        # workflow failure; 1 is the expected day the answer is "yes, there is a newer
        # one" and is handled by the next step. Hence, `set +e` and the explicit test:
        # under the default `set -e` the step would go red every time a pin drifted.
        run: |
          set +e
          bash bin/check-versions.sh "$RUNNER_TEMP/version-title.txt" > "$RUNNER_TEMP/version-report.md"
          status=$?
          cat "$RUNNER_TEMP/version-report.md"
          {
            echo "## Version drift"
            echo
            cat "$RUNNER_TEMP/version-report.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" -le 1 ]

      - name: Open or update the version drift issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The title names what is behind (e.g. "Bump Node 24.20.0 to 24.21.0"), so the
        # issue list says what to do without opening it.
        run: |
          bash bin/ci-open-issue.sh version-drift \
            "$(cat "$RUNNER_TEMP/version-title.txt")" \
            "$RUNNER_TEMP/version-report.md"

  # A separate job rather than more steps on `check`, for three reasons: the Node check
  # needs no Go toolchain and should not wait for one, a Go setup failure must not suppress
  # the Node report, and the two file separate issues so neither buries the other.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # govulncheck type-checks the packages it scans, and govips is cgo, so its preamble
      # needs the libvips headers to resolve. Without them every C constant comes back
      # unknown and the scan dies with "duplicate key unknown in map literal" from
      # vips/foreign.go -- which is what the first run of this job did.
      #
      # Deliberately a shorter list than ci.yml's: this only ever builds, never decodes an
      # image, so libheif-plugin-libde265 (a runtime HEIC decoder) is not needed here.
      # Via bin/ci-apt-install.sh for the mirror defences described in its header.
      - name: Install libvips headers
        run: bash bin/ci-apt-install.sh libvips-dev pkg-config

      # go-version-file rather than a literal, matching ci.yml: go.mod is the only place
      # naming the Go version.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check the Go toolchain pin and for reachable vulnerabilities
        id: check
        # Same exit-code contract as bin/check-versions.sh above: 0 current, 1 something to
        # report, 2 the check itself could not run. Only 2 is a workflow failure. Note the
        # script translates govulncheck's own exit 3 into 1.
        run: |
          set +e
          bash bin/check-go.sh "$RUNNER_TEMP/go-title.txt" > "$RUNNER_TEMP/go-report.md"
          status=$?
          cat "$RUNNER_TEMP/go-report.md"
          {
            echo "## Go"
            echo
            cat "$RUNNER_TEMP/go-report.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" -le 1 ]

      - name: Open or update the Go issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The title leads with a reachable vulnerability when there is one, so the issue
        # list distinguishes "act now" from "bump when convenient" without being opened.
        run: |
          bash bin/ci-open-issue.sh go \
            "$(cat "$RUNNER_TEMP/go-title.txt")" \
            "$RUNNER_TEMP/go-report.md"
